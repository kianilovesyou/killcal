<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KillCal">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<title>KillCal</title>
<style>
@font-face{font-family:KillCalRoboto;font-weight:400;font-style:normal;font-display:swap;src:url('fonts/Roboto-Regular.ttf') format('truetype')}
@font-face{font-family:KillCalRoboto;font-weight:500;font-style:normal;font-display:swap;src:url('fonts/Roboto-Medium.ttf') format('truetype')}
@font-face{font-family:KillCalRoboto;font-weight:700;font-style:normal;font-display:swap;src:url('fonts/Roboto-Bold.ttf') format('truetype')}
:root{--bg:#000;--card:#14101c;--ink:#f4eefc;--mut:#a99bc0;--line:#2b2238;--acc:#9E13FF;--acct:#bf6bff;--p:#ff7a45;--c:#f2b705;--f:#2ec4b6;--ok:#14a76c;--bad:#ff5c63;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 KillCalRoboto,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 86px)}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--acc);color:#fff;font-weight:500;cursor:pointer}
button.ghost{background:transparent;color:var(--acct);padding:6px 8px}button.sec{background:var(--line);color:var(--ink)}
button.x{background:transparent;color:var(--mut);padding:4px 8px;font-size:20px}
input,select{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:6px}
.item{padding:9px 0;border-top:1px solid var(--line)}.item b{font-weight:500}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:480px}nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:14px 4px}nav button.on{color:var(--acct)}
.modal{position:fixed;inset:0;background:rgba(8,12,20,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
#scan{background:#000;align-items:stretch;flex-direction:column;z-index:30}#vid{flex:1;width:100%;object-fit:cover;min-height:0}
.frame{position:absolute;left:12%;right:12%;top:30%;height:26%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90%}
#toast[hidden]{display:none}
/* ===== Feinschliff: weiße Konturen, sanfte Bewegung ===== */
:root{--edge:rgba(255,255,255,.14);--edge2:rgba(255,255,255,.5);--ease:cubic-bezier(.2,.8,.2,1)}
html{background:#000}
body{background:radial-gradient(120% 55% at 50% -12%,rgba(158,19,255,.26),transparent 62%) no-repeat,#000;min-height:100vh}
h1{letter-spacing:-.01em}
.card{border:1px solid var(--edge);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.item{border-top-color:rgba(255,255,255,.08)}
input,select{border:1px solid var(--edge);transition:border-color .2s,box-shadow .25s var(--ease),background-color .2s}
input:focus,select:focus{outline:none;border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14)}
button{border:1px solid transparent;transition:transform .2s var(--ease),filter .2s,background-color .2s,border-color .2s,box-shadow .25s var(--ease),opacity .2s;-webkit-user-select:none;user-select:none}
button:not(.ghost):not(.x):not(.sec){box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 8px 22px rgba(158,19,255,.32)}
button.sec{background:transparent;color:#fff;border-color:var(--edge2)}
button:active{transform:scale(.96)}
button:focus-visible,[data-a]:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(hover:hover){button:hover{filter:brightness(1.14)}button.sec:hover{border-color:#fff}.item[data-a]:hover{background:rgba(255,255,255,.04)}}
.item[data-a]{transition:background-color .2s,transform .2s var(--ease);border-radius:10px}
.item[data-a]:active{background:rgba(255,255,255,.08);transform:scale(.985)}
.bar{background:rgba(255,255,255,.1)}.bar i{transition:width .6s var(--ease)}
circle[stroke-linecap]{filter:drop-shadow(0 0 7px rgba(158,19,255,.7))}
nav{background:rgba(10,8,16,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--edge)}
nav button{box-shadow:none!important;background:transparent!important;position:relative;border:0;transition:color .25s,transform .2s var(--ease)}
nav button::after{content:"";position:absolute;left:32%;right:32%;top:-1px;height:2px;border-radius:2px;background:#fff;transform:scaleX(0);transition:transform .35s var(--ease)}
nav button.on{color:#fff}nav button.on::after{transform:scaleX(1)}
.modal{animation:fade .22s ease both}
.sheet{border:1px solid var(--edge);border-bottom:0;animation:up .34s var(--ease) both}
#toast{animation:pop .28s var(--ease) both}
.fresh>*{animation:rise .42s var(--ease) both}
.fresh>*:nth-child(2){animation-delay:.04s}.fresh>*:nth-child(3){animation-delay:.08s}.fresh>*:nth-child(4){animation-delay:.12s}.fresh>*:nth-child(5){animation-delay:.16s}.fresh>*:nth-child(n+6){animation-delay:.2s}
.fresh .bar i{animation:grow .8s var(--ease) both}
.fresh circle[stroke-linecap]{animation:ring 1s var(--ease) both}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{width:0}}
@keyframes ring{from{stroke-dasharray:0 400}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== Tagebuch im Karten-Look ===== */
:root{--card:#151416;--line:#2a2830}
.top{padding:18px 14px 16px}
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px}
.side{text-align:center;display:flex;flex-direction:column;gap:2px}.side b{font-size:22px;font-weight:700}
.mid{display:flex;justify-content:center}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.mc .mut{font-size:13px;white-space:nowrap}.mc .bar{height:6px;margin:6px 0 5px}.mv{font-size:13px;color:var(--ink)}
.sech{font-size:22px;font-weight:700;margin:22px 2px 10px}
.card.list{padding:2px 14px}
.meal+.meal{border-top:1px solid rgba(255,255,255,.08)}
.mrow{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer;transition:opacity .2s}
.mrow:active{opacity:.7}
.mt{font-size:17px;font-weight:700}.chev{color:var(--mut);font-weight:400;display:inline-block;transition:transform .3s var(--ease)}
.mrow[aria-expanded=true] .chev{transform:rotate(90deg)}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;margin-top:2px}
.rng{flex:none;overflow:visible}.meal .rng circle,.list .rng circle{filter:none!important}.rng circle:nth-of-type(2){transition:stroke-dasharray .7s var(--ease)}
button.plus{flex:none;width:42px;height:42px;border-radius:50%;padding:0;font-size:26px;line-height:1;display:grid;place-items:center;background:#fff!important;color:#000!important;box-shadow:none!important;border:0}
button.plus:active{transform:scale(.9)}
button.minus{flex:none;width:42px;height:42px;border-radius:50%;padding:0;font-size:22px;line-height:1;display:grid;place-items:center;background:transparent!important;color:#fff!important;box-shadow:none!important;border:1px solid var(--edge2)}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease)}
.det.open{grid-template-rows:1fr}.det-in{overflow:hidden;min-height:0}
.det .item:first-child{border-top:1px solid rgba(255,255,255,.08)}
</style></head><body>
<div id="app"></div>
<nav><div><button data-a="tab" data-t="diary">Tagebuch</button><button data-a="tab" data-t="hist">Verlauf</button><button data-a="tab" data-t="weight">Gewicht</button><button data-a="tab" data-t="profile">Profil</button></div></nav>
<div class="modal" id="add" hidden><div class="sheet" id="sh"></div></div>
<div class="modal" id="scan" hidden>
  <video id="vid" playsinline muted></video><div class="frame"></div>
  <div style="padding:14px;background:#000;display:flex;gap:8px"><input id="man" inputmode="numeric" placeholder="Barcode manuell eingeben"><button data-a="manual">OK</button><button class="sec" data-a="closescan">Zu</button></div>
</div>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>Math.round(n),R1=n=>Math.round(n*10)/10;
let S={profile:null,days:{},weights:[],recent:[],dishes:[]};

const save=()=>{try{localStorage.setItem(KEY(),JSON.stringify(S))}catch(e){}push()};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let date=iso(new Date()),tab=S.profile?'diary':'profile',ctx={meal:'b',list:[],food:null};
const day=()=>S.days[date]||(S.days[date]={items:[],water:0});
const MEALS=[['b','Frühstück'],['l','Mittagessen'],['d','Abendessen'],['s','Snacks']];
const ACT=[['1.2','Kaum aktiv (Bürojob)'],['1.375','Leicht aktiv (1–3 Trainings/Woche)'],['1.55','Mäßig aktiv (3–5 Trainings)'],['1.725','Sehr aktiv (6–7 Trainings)']];
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}

// Zielberechnung: Mifflin-St-Jeor, Mindestgrenze zum Schutz
function plan(p){
  const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161),tdee=bmr*p.act;
  const adj={lose:-500,keep:0,gain:300}[p.goal],min=p.sex==='m'?1500:1200;
  const auto=Math.max(min,R(tdee+adj));
  const kcal=p.custom?Math.max(min,R(p.custom)):auto;
  const prot=R(p.w*(p.goal==='keep'?1.2:1.6)),fat=R(kcal*.28/9),carb=Math.max(0,R((kcal-prot*4-fat*9)/4));
  return{kcal,prot,fat,carb,tdee:R(tdee),min,clamped:tdee+adj<min};
}
function totals(it){return it.reduce((a,x)=>(a.k+=x.k,a.p+=x.p,a.c+=x.c,a.f+=x.f,a),{k:0,p:0,c:0,f:0})}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#app').innerHTML={diary:vDiary,hist:vHist,weight:vWeight,profile:vProfile}[tab]();
  window.scrollTo(0,0);
}
const N=n=>Math.round(n).toLocaleString('de-DE');
const SHARE={b:.25,l:.35,d:.30,s:.10},MICON={b:'🥐',l:'🍝',d:'🍽️',s:'🍎'};
function ring(fr,size,sw,inner,over){const r=(size-sw)/2-1,C=2*Math.PI*r,c=size/2;
  return`<svg class="rng" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="${sw}"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${over?'var(--bad)':'url(#rg)'}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*Math.min(1,Math.max(0,fr))} ${C}" transform="rotate(-90 ${c} ${c})"/>${inner||''}</svg>`}
const macro=(l,v,g)=>`<div class="mc"><div class="mut">${l}</div><div class="bar"><i style="width:${Math.min(100,g?v/g*100:0)}%;background:var(--acc)"></i></div><div class="mv">${R(v)} / ${g} g</div></div>`;
function vDiary(){
  const pl=plan(S.profile),d=day(),t=totals(d.items),left=pl.kcal-t.k,over=left<0;
  ctx.open=ctx.open||{};
  const dt=new Date(date+'T12:00:00'),today=date===iso(new Date());
  const meals=MEALS.map(([k,n])=>{const L=d.items.filter(x=>x.meal===k),sum=L.reduce((a,x)=>a+x.k,0),tg=R(pl.kcal*SHARE[k]),names=L.map(x=>x.name).join(', ');
    return`<div class="meal"><div class="mrow" data-a="toggle" data-m="${k}" role="button" tabindex="0" aria-expanded="${!!ctx.open[k]}">
      ${ring(sum/tg,50,4,`<text x="25" y="25" text-anchor="middle" dominant-baseline="central" font-size="20">${MICON[k]}</text>`,sum>tg*1.15)}
      <div class="grow"><div class="mt">${n} <span class="chev">›</span></div><div class="mut">${R(sum)} / ${tg} kcal</div>${names?`<div class="mut nm">${esc(names)}</div>`:''}</div>
      <button class="plus" data-a="add" data-m="${k}" aria-label="${n}: Lebensmittel hinzufügen">+</button></div>
      <div class="det${ctx.open[k]?' open':''}"><div class="det-in">
      ${L.map(x=>`<div class="item row"><div class="grow" data-a="edit" data-id="${x.id}" style="cursor:pointer"><b>${esc(x.name)}</b><div class="mut">${esc(x.brand?x.brand+' · ':'')}${x.u?x.q+' '+esc(x.u)+' · ':''}${R(x.g)} ${x.mu==='ml'?'ml':'g'} · ${R(x.p)}P ${R(x.c)}K ${R(x.f)}F</div></div><span>${x.k}</span><button class="x" data-a="del" data-id="${x.id}" aria-label="Löschen">×</button></div>`).join('')}
      <div class="row" style="flex-wrap:wrap;padding:4px 0 8px"><button class="ghost" data-a="copy" data-m="${k}">Von gestern</button>${L.length?`<button class="ghost" data-a="dish" data-m="${k}">Als Gericht speichern</button>`:''}</div></div></div></div>`}).join('');
  return`<div class="row sp"><button class="ghost" data-a="day" data-d="-1" aria-label="Vorheriger Tag">‹</button><div style="text-align:center"><h1 style="margin:0">${today?'Heute':dt.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}</h1>${S.name?`<div class="mut" style="font-size:13px">${esc(S.name)}</div>`:''}</div><button class="ghost" data-a="day" data-d="1" aria-label="Nächster Tag">›</button></div>
  <div class="card top" style="margin-top:12px"><div class="hero"><div class="side"><b>${N(t.k)}</b><span class="mut">Gegessen</span></div>
    <div class="mid">${ring(t.k/pl.kcal,160,11,`<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c46bff"/><stop offset="1" stop-color="#9E13FF"/></linearGradient></defs><text x="80" y="76" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">${N(Math.abs(left))}</text><text x="80" y="100" text-anchor="middle" font-size="13" fill="var(--mut)">${over?'drüber':'Übrig'}</text>`,over)}</div>
    <div class="side"><b>${N(pl.kcal)}</b><span class="mut">Ziel</span></div></div>
    <div class="macros">${macro('Kohlenhydrate',t.c,pl.carb)}${macro('Eiweiß',t.p,pl.prot)}${macro('Fett',t.f,pl.fat)}</div></div>
  <h2 class="sech">Ernährung</h2><div class="card list">${meals}</div>
  <h2 class="sech">Wasser</h2><div class="card list"><div class="mrow" style="cursor:default">${ring(d.water/2000,50,4,`<text x="25" y="25" text-anchor="middle" dominant-baseline="central" font-size="20">💧</text>`)}<div class="grow"><div class="mt">Wasser</div><div class="mut">${d.water} / 2000 ml</div></div><button class="minus" data-a="water" data-v="-250" aria-label="250 ml weniger">−</button><button class="plus" data-a="water" data-v="250" aria-label="250 ml mehr">+</button></div></div>`;
}
function vHist(){
  const pl=plan(S.profile),rows=[];
  for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=iso(d),it=(S.days[k]||{items:[]}).items;rows.push({k,d,t:it.reduce((a,x)=>a+x.k,0),has:it.length>0})}
  const lg=rows.filter(r=>r.has),avg=lg.length?R(lg.reduce((a,r)=>a+r.t,0)/lg.length):0,mx=Math.max(pl.kcal*1.3,...rows.map(r=>r.t));
  return`<h1>Verlauf</h1><div class="card"><div class="mut">Ø ${avg} kcal an ${lg.length} erfassten Tagen (letzte 30 Tage) · Ziel ${pl.kcal} kcal. Tippe auf einen Tag, um ihn zu öffnen.</div>
  ${[...rows].reverse().map(r=>`<div class="item" data-a="goto" data-k="${r.k}" style="cursor:pointer"><div class="row sp"><span>${r.d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}</span><b>${r.has?R(r.t)+' kcal':'–'}</b></div><div class="bar"><i style="width:${Math.min(100,r.t/mx*100)}%;background:${r.t>pl.kcal?'var(--bad)':'var(--acc)'}"></i></div></div>`).join('')}</div>`;
}
function vWeight(){
  const W=[...S.weights].sort((a,b)=>a.d<b.d?-1:1),last=W[W.length-1];
  let svg='';
  if(W.length>1){const v=W.map(x=>x.w),mn=Math.min(...v)-1,mx=Math.max(...v)+1,pts=W.map((x,i)=>`${10+i*(300/(W.length-1))},${110-(x.w-mn)/(mx-mn)*100}`).join(' ');
    svg=`<svg viewBox="0 0 320 120" width="100%"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round"/></svg><div class="row sp mut"><span>${mn+1} kg</span><span>${mx-1} kg</span></div>`}
  return`<h1>Gewicht</h1><div class="card"><label>Gewicht am ${new Date(date+'T12:00:00').toLocaleDateString('de-DE')} (kg)</label><div class="row"><input id="wv" type="number" step="0.1" inputmode="decimal" value="${last?last.w:''}"><button data-a="wsave">Speichern</button></div></div>
  <div class="card">${svg||'<p class="mut" style="margin:0">Trage mindestens zwei Gewichte ein, dann siehst du den Verlauf.</p>'}</div>
  <div class="card">${[...W].reverse().slice(0,30).map(x=>`<div class="item row sp"><span>${new Date(x.d+'T12:00:00').toLocaleDateString('de-DE')}</span><b>${x.w} kg</b><button class="x" data-a="wdel" data-d="${x.d}">×</button></div>`).join('')||'<span class="mut">Noch keine Einträge.</span>'}</div>`;
}
function vProfile(){
  const p=S.profile||{sex:'f',age:30,h:170,w:70,act:1.375,goal:'lose'},pl=S.profile&&plan(p);
  const sel=(a,v)=>a.map(([k,n])=>`<option value="${k}" ${String(v)===k?'selected':''}>${n}</option>`).join('');
  return`<h1>${S.profile?'Profil':'Willkommen – lass uns dein Ziel berechnen'}</h1><div class="card">
  <label style="margin-top:0">Name</label><input id="pName" maxlength="30" autocomplete="given-name" value="${esc(S.name||'')}">${uname?`<div class="mut" style="margin-top:4px">Anmeldename: ${esc(uname)}</div>`:''}<div class="grid" style="margin-top:4px"><div><label>Geschlecht</label><select id="pSex"><option value="f" ${p.sex==='f'?'selected':''}>Weiblich</option><option value="m" ${p.sex==='m'?'selected':''}>Männlich</option></select></div><div><label>Alter</label><input id="pAge" type="number" inputmode="numeric" value="${p.age}"></div>
  <div><label>Größe (cm)</label><input id="pH" type="number" inputmode="numeric" value="${p.h}"></div><div><label>Gewicht (kg)</label><input id="pW" type="number" step="0.1" inputmode="decimal" value="${p.w}"></div></div>
  <label>Aktivität</label><select id="pAct">${sel(ACT,p.act)}</select>
  <label>Ziel</label><select id="pGoal">${sel([['lose','Abnehmen'],['keep','Gewicht halten'],['gain','Zunehmen / Muskelaufbau']],p.goal)}</select>
  <label>Eigenes Kalorienziel (leer = automatisch)</label><input id="pCus" type="number" inputmode="numeric" value="${p.custom||''}" placeholder="z. B. 2000">
  <button data-a="psave" style="width:100%;margin-top:14px">Speichern</button></div>

function localSearch(q){

function norm(p){const n=p.nutriments||{},k=n['energy-kcal_100g']??(n.energy_100g?n.energy_100g/4.184:null),name=str(p.product_name).trim();
  if(!name||k==null)return null;const P=+n.proteins_100g||0,C=+n.carbohydrates_100g||0,F=+n.fat_100g||0;
  if(!(k>=0&&k<=950)||P+C+F>105)return null;const s=+p.serving_quantity||0;
  return{name,brand:str(p.brands).split(',')[0].trim(),k:+k,p:P,c:C,f:F,s,u:s>0?'Portion':'',ug:s,code:p.code}}

function rank(L,q){const qt=words(q).map(stem),seen={};
  return L.map((f,i)=>{const nw=words(f.name).map(stem),all=words(f.name+' '+f.brand).map(stem);
    if(!qt.every(t=>all.some(w=>w.startsWith(t))))return null;
    const key=nz(f.name+f.brand);if(seen[key])return null;seen[key]=1;
    let sc=0;qt.forEach(t=>{if(nw.includes(t))sc+=2;else if(nw.some(w=>w.startsWith(t)))sc+=1});
    if(nw[0]&&nw[0].startsWith(qt[0]))sc+=2;
    return{f,sc:sc-nw.length*.15-i*.02}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).map(x=>x.f)}

  for(const u of urls){try{const j=await getJSON(u),L=rank((j.hits||j.products||[]).map(norm).filter(Boolean),q);if(L.length){qcache[q]=L;return L}}catch(x){err=x}}
  if(err)throw err;return[]}

async function lookup(code){

    try{const j=await getJSON(u,9000);f=(j.status===1&&norm(j.product))||null;fail=false;break}catch(e){fail=true}}
  if(fail){toast('Datenbank antwortet nicht. Bitte nochmal scannen.');return}

let stopScan=()=>{$('#scan').hidden=true};

async function startScan(){
  ctx.editId=null;$('#add').hidden=true;$('#scan').hidden=false;let done=false;
  const hit=c=>{if(done)return;done=true;stopScan();lookup(c)};
  try{

      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}),v=$('#vid');v.srcObject=st;await v.play();let on=true;
      stopScan=()=>{on=false;st.getTracks().forEach(t=>t.stop());v.srcObject=null;$('#scan').hidden=true};
      (async()=>{while(on){try{const r=await det.detect(v);if(r.length)return hit(r[0].rawValue)}catch(e){}await new Promise(r=>setTimeout(r,250))}})();
    }else{
      await loadZX();const rd=new ZXing.BrowserMultiFormatReader();
      stopScan=()=>{try{rd.reset()}catch(e){}$('#scan').hidden=true};
      rd.decodeFromVideoDevice(null,'vid',r=>{if(r)hit(r.getText())});

  login:async()=>{const u=slug($('#lu').value),p=$('#lp').value;if(!u||!p){toast('Name und Code eingeben.');return}
    if(!sb){if(LOCK[u]&&h53('killcal|'+u+'|'+p)===LOCK[u]){try{localStorage.setItem(SESS,u)}catch(e){}enter({id:null,email:u+'@lokal'})}else toast('Name oder Code falsch.');return}
    const{data,error}=await sb.auth.signInWithPassword({email:u+'@killcal.app',password:p});if(error){toast('Anmeldung fehlgeschlagen: Name oder Passwort falsch.');return}enter(data.user)},
  logout:async()=>{if(sb){try{localStorage.removeItem(KEY())}catch(e){}await sb.auth.signOut()}try{localStorage.removeItem(SESS)}catch(e){}uid=null;uname='';S={profile:null,days:{},weights:[],recent:[],dishes:[]};loginView()},
  import:()=>$('#imp').click(),
  toggle:b=>{const k=b.dataset.m;ctx.open=ctx.open||{};ctx.open[k]=!ctx.open[k];const det=b.nextElementSibling;if(det)det.classList.toggle('open',ctx.open[k]);b.setAttribute('aria-expanded',ctx.open[k])},
  tab:b=>{tab=b.dataset.t;if(!S.profile)tab='profile';render();fresh()},
  day:b=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+ +b.dataset.d);date=iso(d);render();fresh()},
  add:b=>openAdd(b.dataset.m),closeadd:()=>{ctx.editId=null;$('#add').hidden=true},back:()=>sheetSearch(),
  del:b=>{const d=day();d.items=d.items.filter(x=>String(x.id)!==b.dataset.id);save();render()},
  water:b=>{const d=day();d.water=Math.max(0,d.water+ +b.dataset.v);save();render()},
  startscan:startScan,closescan:()=>stopScan(),manual:()=>{const c=$('#man').value.trim();if(c){stopScan();lookup(c)}},
  pick:b=>pick(ctx.list[+b.dataset.i]),custom:()=>custom(),
  csave:b=>{const n=$('#cn').value.trim(),k=+$('#ck').value;if(!n||!(k>=0)||$('#ck').value===''){toast('Name und kcal angeben.');return}
    pick({name:n,brand:$('#cb').value.trim(),k,p:+$('#cp').value||0,c:+$('#cc').value||0,f:+$('#cf').value||0,s:0,u:$('#cu').value.trim(),ug:+$('#cg').value||0,code:b.dataset.code})},
  confirm:()=>{const f=ctx.food,un=$('#un').value==='u'&&f.ug>0,v=+$('#gr').value,g=un?v*f.ug:v;if(!(g>0)){toast('Menge eingeben.');return}if(ctx.editId){const d=day();d.items=d.items.filter(x=>String(x.id)!==String(ctx.editId));ctx.editId=null}
    day().items.push({id:Date.now()+Math.random(),meal:$('#ml').value,name:f.name,brand:f.brand,g:R1(g),...(un?{q:v,u:f.u,ug:f.ug}:($('#un').value==='ml'?{mu:'ml'}:{})),k:R(f.k*g/100),p:R1(f.p*g/100),c:R1(f.c*g/100),f:R1(f.f*g/100)});
    if(!f.dish)S.recent=[f,...S.recent.filter(x=>!(x.name===f.name&&x.brand===f.brand))].slice(0,15);save();$('#add').hidden=true;render()},
  wsave:()=>{const w=+$('#wv').value;if(!(w>20&&w<400)){toast('Bitte gültiges Gewicht eingeben.');return}
    S.weights=S.weights.filter(x=>x.d!==date);S.weights.push({d:date,w:R1(w)});if(S.profile)S.profile.w=R1(w);save();render()},
  wdel:b=>{S.weights=S.weights.filter(x=>x.d!==b.dataset.d);save();render()},
  psave:()=>{const p={sex:$('#pSex').value,age:+$('#pAge').value,h:+$('#pH').value,w:+$('#pW').value,act:+$('#pAct').value,goal:$('#pGoal').value,custom:+$('#pCus').value||0};
    if(!(p.age>=14&&p.age<=100&&p.h>100&&p.h<250&&p.w>25&&p.w<400)){toast('Bitte Alter (ab 14), Größe und Gewicht prüfen.');return}
    S.profile=p;S.name=$('#pName').value.trim().slice(0,30);save();tab='diary';render()},
  export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='killcal-daten.json';a.click()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('mrow')){e.preventDefault();A.toggle(e.target)}if(e.key==='Enter'&&e.target.id==='man')A.manual();if(e.key==='Enter'&&e.target.id==='lp')A.login()});
// ===== Konto & Sync (Supabase). Hier nach dem Einrichten eintragen: =====
const CFG={url:'',key:'',signup:false}; // signup:true zeigt „Konto erstellen“ (nur kurz zum Anlegen der Konten, danach wieder false)
const slug=v=>v.trim().toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9._-]/g,'');   // Project URL und anon/public key – NIE den service_role key!
let sb=null,uid=null,ts=0,pt,uname='';
function fresh(){const a=$('#app');a.classList.add('fresh');clearTimeout(fresh.t);fresh.t=setTimeout(()=>a.classList.remove('fresh'),1100)}
const KEY=()=>'killcal-'+(uid||uname||'local');
// Zugang ohne Server: Namen + Code (nur Sperre der Oberfläche, kein echter Schutz)
const h53=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const LOCK={chriss:'l5862oxko8',kianah:'567de7fb8k'};
const SESS='killcal-session';
function push(){if(!sb||!uid)return;clearTimeout(pt);pt=setTimeout(async()=>{ts=new Date();const{error}=await sb.from('diary').upsert({user_id:uid,data:S,updated_at:ts.toISOString()});if(error)toast('Sync fehlgeschlagen – bitte Verbindung prüfen.')},800)}
async function pull(){if(!sb||!uid)return;try{const{data}=await sb.from('diary').select('data,updated_at').eq('user_id',uid).maybeSingle();if(data&&new Date(data.updated_at)>ts){ts=new Date(data.updated_at);S=Object.assign(S,data.data);render()}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
document.addEventListener('change',e=>{if(e.target.id!=='imp'||!e.target.files[0])return;e.target.files[0].text().then(t=>{try{const j=JSON.parse(t);if(!j.days)throw 0;S=Object.assign({profile:null,days:{},weights:[],recent:[],dishes:[]},j);save();tab=S.profile?'diary':'profile';render();toast('Import fertig.')}catch(x){toast('Datei nicht lesbar.')}})});
function loginView(){document.querySelector('nav').style.display='none';$('#app').innerHTML=`<h1 style="text-align:center;margin-top:60px">KillCal</h1><div class="card"><label>Name</label><input id="lu" autocapitalize="words" autocomplete="username"><div class="mut" style="margin-top:6px">${CFG.url?'Dein Name ist zugleich dein Anmeldename (klein geschrieben).':''}</div><label>${CFG.url?'Passwort':'Code'}</label><input id="lp" type="password" inputmode="${CFG.url?'text':'numeric'}" autocomplete="current-password"><button data-a="login" style="width:100%;margin-top:14px">Anmelden</button>${CFG.signup?'<button class="sec" data-a="signup" style="width:100%;margin-top:8px">Konto erstellen</button>':''}</div>`}
async function enter(u){
  uid=u?u.id:null;uname=u&&u.email?u.email.split('@')[0]:'';let loc={},rem;
  try{loc=JSON.parse(localStorage.getItem(KEY())||'{}')}catch(e){}
  if(sb){try{const r=await sb.from('diary').select('data,updated_at').eq('user_id',uid).maybeSingle();if(!r.error)rem=r.data||{data:{}}}catch(e){}}
  const use=rem&&Object.keys(rem.data||{}).length?rem.data:loc;
  ts=rem&&rem.updated_at?new Date(rem.updated_at):0;
  S=Object.assign({profile:null,days:{},weights:[],recent:[],dishes:[]},use);
  if(!S.name&&uname)S.name=uname.charAt(0).toUpperCase()+uname.slice(1);tab=S.profile?'diary':'profile';date=iso(new Date());
  document.querySelector('nav').style.display='';render();fresh();
  if(sb&&rem!==undefined)push();
}
async function boot(){
  if(CFG.url&&CFG.key){
    if(!window.supabase){document.querySelector('nav').style.display='none';$('#app').innerHTML='<h1>KillCal</h1><p class="mut">Keine Verbindung. Bitte online öffnen.</p>';return}
    sb=supabase.createClient(CFG.url,CFG.key);const{data}=await sb.auth.getSession();
    if(data.session)enter(data.session.user);else loginView();
  }else{let u='';try{u=localStorage.getItem(SESS)||''}catch(e){}if(LOCK[u])enter({id:null,email:u+'@lokal'});else loginView()}
}
window.addEventListener('load',boot);
</script></body></html>
