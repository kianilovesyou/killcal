<style>

:root{--bg:#000;--card:#14101c;--ink:#f4eefc;--mut:#a99bc0;--line:#2b2238;--acc:#9E13FF;--acct:#bf6bff;--acc2:#c46bff;--accrgb:158,19,255;--p:#ff7a45;--c:#f2b705;--f:#2ec4b6;--ok:#14a76c;--bad:#ff5c63;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 KillCalRoboto,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 86px)}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}

/* ===== Feinschliff: weiße Konturen, sanfte Bewegung ===== */
:root{--edge:rgba(255,255,255,.14);--edge2:rgba(255,255,255,.5);--ease:cubic-bezier(.2,.8,.2,1)}

h1{letter-spacing:-.01em}
.card{border:1px solid var(--edge);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}

@media(hover:hover){button:hover{filter:brightness(1.14)}button.sec:hover{border-color:#fff}.item[data-a]:hover{background:rgba(255,255,255,.04)}}
.item[data-a]{transition:background-color .2s,transform .2s var(--ease);border-radius:10px}
.item[data-a]:active{background:rgba(255,255,255,.08);transform:scale(.985)}
.bar{background:rgba(255,255,255,.1)}.bar i{transition:width .6s var(--ease)}

nav{background:rgba(var(--bgrgb,40,12,59),.84);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--edge)}
nav button{box-shadow:none!important;background:transparent!important;position:relative;border:0;transition:color .25s,transform .2s var(--ease)}
nav button::after{content:"";position:absolute;left:32%;right:32%;top:-1px;height:2px;border-radius:2px;background:#fff;transform:scaleX(0);transition:transform .35s var(--ease)}
nav button.on{color:#fff}nav button.on::after{transform:scaleX(1)}
.modal{animation:fade .22s ease both}
.sheet{background:var(--card);border:1px solid var(--edge);border-bottom:0;animation:up .34s var(--ease) both}
#toast{animation:pop .28s var(--ease) both}
.fresh>*{animation:rise .42s var(--ease) both}
.fresh>*:nth-child(2){animation-delay:.04s}.fresh>*:nth-child(3){animation-delay:.08s}.fresh>*:nth-child(4){animation-delay:.12s}.fresh>*:nth-child(5){animation-delay:.16s}.fresh>*:nth-child(n+6){animation-delay:.2s}
.fresh .bar i{animation:grow .8s var(--ease) both}
.fresh circle[stroke-linecap]{animation:ring 1s var(--ease) both}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}

/* ===== Tagebuch im Karten-Look ===== */
:root{--card:#151416;--line:#2a2830}
.top{padding:18px 14px 16px}
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px}

button.plus:active{transform:scale(.9)}
button.minus{flex:none;width:42px;height:42px;border-radius:50%;padding:0;font-size:22px;line-height:1;display:grid;place-items:center;background:transparent!important;color:#fff!important;box-shadow:none!important;border:1px solid var(--edge2)}

/* ===== Tiefe, Bewegung, Wischen, Platzhalter ===== */
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 45%),var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 2px rgba(0,0,0,.5),0 16px 34px -12px rgba(0,0,0,.7)}

.card.top{background:radial-gradient(58% 52% at 50% 36%,rgba(var(--accrgb),.17),transparent 72%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 45%),var(--card)}
.card.top2{background:radial-gradient(70% 90% at 50% 0%,rgba(var(--accrgb),.14),transparent 72%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 45%),var(--card);padding:18px 14px}
button.plus{background:linear-gradient(180deg,#fff,#e8e4f0)!important;box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 -2px 0 rgba(0,0,0,.08)!important;transition:transform .2s var(--ease),box-shadow .3s var(--ease)}

.fresh circle[stroke-linecap]{animation:none!important}
.rw{display:inline-flex;flex:none;border-radius:50%}
.rw.pulse{animation:pulse .9s var(--ease) .32s both}

/* Menü schließen */
.modal.out{animation:fadeOut .22s ease both}.modal.out .sheet{animation:down .23s ease-in both}
@keyframes fadeOut{to{opacity:0}}@keyframes down{to{transform:translateY(44px);opacity:.3}}
/* Wischen */
.sw{position:relative;overflow:hidden;border-top:1px solid rgba(255,255,255,.08);transition:max-height .3s var(--ease),opacity .26s}
.sw.gone{max-height:0!important;opacity:0;border-top-width:0}

.sw.dragging .sw-bg{opacity:1}.sw.armed .sw-bg{filter:brightness(1.2) saturate(1.1)}
.sw .item{border-top:0;background:var(--card);padding:10px 0;position:relative;touch-action:pan-y;transition:transform .3s var(--ease)}
.sw .item.drag{transition:none}
.sw .item.new{animation:itemIn .7s var(--ease) .26s both}
@keyframes itemIn{0%{opacity:0;transform:translateX(26px);background:rgba(var(--accrgb),.3)}60%{opacity:1;transform:none;background:rgba(var(--accrgb),.22)}100%{background:var(--card)}}
/* Suchplatzhalter */
.skl{height:13px;border-radius:7px;margin:5px 0;background:linear-gradient(90deg,rgba(255,255,255,.06) 25%,rgba(255,255,255,.16) 50%,rgba(255,255,255,.06) 75%);background-size:300% 100%;animation:shim 1.3s linear infinite}
.skl.s2{height:10px;opacity:.7}.skl.s3{width:70px;height:14px}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.item.in{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i)*45ms)}
/* Verlauf, Gewicht, Profil */
.hero2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.hero2.c2{grid-template-columns:repeat(2,1fr)}.hero2.c4{grid-template-columns:repeat(4,1fr)}
.hero2 .side b{font-size:24px}.hero2.c4 .side b{font-size:20px}.hero2 .mut{font-size:13px}
.hrow{padding:12px 0;cursor:pointer;border-top:1px solid rgba(255,255,255,.08);transition:opacity .2s}.hrow:first-child{border-top:0}.hrow:active{opacity:.7}
.hrow.wrow{cursor:default;padding:8px 0}
.fresh .hrow .bar i{animation-delay:calc(var(--i)*28ms)}.hrow .bar{margin-top:7px}
.wl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .1s forwards}
.wa{opacity:0;animation:show .8s ease .9s forwards}.wd{opacity:0;animation:show .4s ease 1.1s forwards}
@keyframes show{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.phero{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 8px 20px rgba(var(--accrgb),.4),inset 0 1px 0 rgba(255,255,255,.35)}
.pn{font-size:22px;font-weight:700}
@media(prefers-reduced-motion:reduce){.wl{stroke-dashoffset:0!important}.wa,.wd{opacity:1!important}}
/* ===== Zielübersicht ===== */
.card.goal{background:radial-gradient(70% 90% at 50% 0%,rgba(var(--accrgb),.16),transparent 72%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 45%),var(--card);padding:18px 14px}
.gt{font-size:18px;font-weight:500}.gt b{font-weight:700;color:var(--acct)}
.gmsg{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--edge);font-size:15px;line-height:1.5}

.avbtn{position:relative;flex:none;width:78px;height:78px;padding:0;border-radius:50%;background:transparent!important;border:2px solid rgba(255,255,255,.6)!important;box-shadow:0 8px 22px rgba(var(--accrgb),.45)!important;overflow:visible}

</style></head><body>
<div id="app"></div>
<nav><div><button data-a="tab" data-t="diary">Tagebuch</button><button data-a="tab" data-t="hist">Verlauf</button><button data-a="tab" data-t="weight">Gewicht</button><button data-a="tab" data-t="profile">Profil</button></div></nav>
<div class="modal" id="add" hidden><div class="sheet" id="sh"></div></div>
<div class="modal" id="scan" hidden>
  <video id="vid" playsinline muted></video><div class="frame"></div>
  <div style="padding:14px;background:#000;display:flex;gap:8px"><input id="man" inputmode="numeric" placeholder="Barcode manuell eingeben"><button data-a="manual">OK</button><button class="sec" data-a="closescan">Zu</button></div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>Math.round(n),R1=n=>Math.round(n*10)/10;
let S={profile:null,days:{},weights:[],recent:[],dishes:[]};

const save=()=>{try{localStorage.setItem(KEY(),JSON.stringify(S))}catch(e){}push()};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let date=iso(new Date()),tab=S.profile?'diary':'profile',ctx={meal:'b',list:[],food:null};
const day=()=>S.days[date]||(S.days[date]={items:[],water:0});
const MEALS=[['b','Frühstück'],['l','Mittagessen'],['d','Abendessen'],['s','Snacks']];
const ACT=[['1.2','Kaum aktiv (Bürojob)'],['1.375','Leicht aktiv (1–3 Trainings/Woche)'],['1.55','Mäßig aktiv (3–5 Trainings)'],['1.725','Sehr aktiv (6–7 Trainings)']];
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}

// Zielberechnung: Mifflin-St-Jeor, Mindestgrenze zum Schutz
function plan(p){
  const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161),tdee=bmr*p.act;
  const adj={lose:-500,keep:0,gain:300}[p.goal],min=p.sex==='m'?1500:1200;
  const auto=Math.max(min,R(tdee+adj));
  const kcal=p.custom?Math.max(min,R(p.custom)):auto;
  const prot=R(p.w*(p.goal==='keep'?1.2:1.6)),fat=R(kcal*.28/9),carb=Math.max(0,R((kcal-prot*4-fat*9)/4));
  return{kcal,prot,fat,carb,tdee:R(tdee),min,clamped:tdee+adj<min};
}
function totals(it){return it.reduce((a,x)=>(a.k+=x.k,a.p+=x.p,a.c+=x.c,a.f+=x.f,a),{k:0,p:0,c:0,f:0})}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const same=ctx.lt===tab&&ctx.ld===date,y=window.scrollY;
  $('#app').innerHTML={diary:vDiary,hist:vHist,weight:vWeight,profile:vProfile}[tab]();
  ctx.lt=tab;ctx.ld=date;window.scrollTo(0,same?y:0);post();
}
const N=n=>Math.round(n).toLocaleString('de-DE');
const N1=n=>Number(n).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
const SHARE={b:.25,l:.35,d:.30,s:.10},MICON={b:'🥐',l:'🍝',d:'🍽️',s:'🍎'};
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
// Ring: füllt sich vom letzten Stand zum neuen Stand (key = Wiedererkennung)
function ring(fr,size,sw,inner,over,key){
  const r=(size-sw)/2-1,C=2*Math.PI*r,c=size/2,f=Math.min(1,Math.max(0,fr||0));ctx.pr=ctx.pr||{};let from=f;
  if(key!=null){const k=date+'|'+key;from=RM?f:(ctx.pr[k]==null?0:ctx.pr[k]);ctx.pr[k]=f}
  return`<svg class="rng" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="${sw}"/><circle ${key!=null?`data-to="${C*f} ${C}"`:''} cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${over?'var(--bad)':'url(#rg)'}" stroke-width="${sw}" stroke-linecap="round" style="stroke-dasharray:${C*from} ${C}" transform="rotate(-90 ${c} ${c})"/>${inner||''}</svg>`}
// Zahlen zählen hoch
function countTo(el,from,to){const abs=el.dataset.abs==='1',fmt=v=>N(abs?Math.abs(v):v);
  if(RM||from===to){el.textContent=fmt(to);return}
  const t0=performance.now(),dur=650;
  (function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(f)})(t0)}
function post(){
  const root=$('#app');ctx.pc=ctx.pc||{};
  root.querySelectorAll('circle[data-to]').forEach(c=>{const to=c.dataset.to;requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.strokeDasharray=to}))});
  root.querySelectorAll('[data-cnt]').forEach(el=>{const k=date+'|'+el.dataset.k,to=+el.dataset.cnt,from=ctx.pc[k]==null?0:ctx.pc[k];ctx.pc[k]=to;countTo(el,from,to)});
  const nw=root.querySelector('.sw-fg.new');if(nw)setTimeout(()=>nw.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'}),60);
  ctx.flash=null;
}
const macro=(l,v,g)=>`<div class="mc"><div class="mut">${l}</div><div class="bar"><i style="width:${Math.min(100,g?v/g*100:0)}%;background:var(--acc)"></i></div><div class="mv">${R(v)} / ${g} g</div></div>`;
function vDiary(){
  const pl=plan(S.profile),d=day(),t=totals(d.items),left=pl.kcal-t.k,over=left<0;
  ctx.open=ctx.open||{};const fl=ctx.flash;
  const dt=new Date(date+'T12:00:00'),today=date===iso(new Date());
  const meals=MEALS.map(([k,n])=>{const L=d.items.filter(x=>x.meal===k),sum=L.reduce((a,x)=>a+x.k,0),tg=R(pl.kcal*SHARE[k]),names=L.map(x=>x.name).join(', ');

// Zielübersicht (nur Information, ändert die Kalorienziele nicht)
function goalCard(p,pl){
  const DAY=864e5,now=new Date();now.setHours(12,0,0,0);
  const fd=d=>d.toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}),fs=d=>d.toLocaleDateString('de-DE',{day:'numeric',month:'short'});
  if(!p.tw)return`<div class="card goal"><div class="gt">Hast du ein Wunschgewicht? ✨</div><div class="mut" style="margin-top:6px;line-height:1.5">Trage unten dein Zielgewicht ein, auf Wunsch auch einen Termin. Dann zeigen wir dir, wie weit du schon bist und in welchem Tempo du dein Ziel erreichen kannst. Ganz ohne Druck, nur als Orientierung.</div></div>`;
  const cur=p.w,tw=p.tw,diff=tw-cur,ad=Math.abs(diff),dir=Math.sign(diff),reached=ad<.15;
  const weekly=(pl.kcal-pl.tdee)*7/7700,aw=Math.abs(weekly),ok=!reached&&Math.sign(weekly)===dir&&aw>=.05;
  const tdate=p.td?new Date(p.td+'T12:00:00'):null,future=!!(tdate&&tdate>now),past=!!(tdate&&tdate<=now);
  const wLeft=future?(tdate-now)/(7*DAY):0,req=future?ad/Math.max(wLeft,1):0;
  const wk=ok?ad/aw:0,proj=ok?new Date(now.getTime()+wk*7*DAY):null,sp=dir<0?1:.5;
  const safeDate=new Date(now.getTime()+ad/(dir<0?.75:.4)*7*DAY);
  const bmi=tw/Math.pow(p.h/100,2);
  const low=bmi<18.5;let msg='';
  if(low&&!reached)msg='';
  else if(reached)msg=`<b>Geschafft! 🎉</b> Du hast dein Zielgewicht erreicht. Darauf darfst du richtig stolz sein. Jetzt geht es darum, es in Ruhe zu halten.`;
  else{
    if(past)msg+=`Dein Wunschtermin ist verstrichen. Kein Problem, Fortschritt zählt! Du kannst unten einen neuen Termin wählen. `;
    if(!ok)msg+=`Dein Kalorienziel führt dich noch nicht in diese Richtung. Wähle unter „Deine Daten“ bei „Ziel“ <b>${dir<0?'Abnehmen':'Zunehmen / Muskelaufbau'}</b>, dann passt alles zusammen.${future?` Für deinen Wunschtermin wären etwa <b>${N1(req)} kg pro Woche</b> nötig.`:''}`;
    else if(wk>104)msg+=`Mit deinem Kalorienziel wäre das ein langer Weg (über zwei Jahre). Kleine Schritte zählen trotzdem. Du kannst unten ein eigenes Kalorienziel festlegen.`;
    else if(!future)msg+=`Mit deinem Kalorienziel schaffst du ungefähr <b>${N1(aw)} kg pro Woche</b>. So kannst du dein Ziel voraussichtlich um den <b>${fd(proj)}</b> erreichen.${past?'':' Setz dir gern einen Wunschtermin, dann rechnen wir dein Wunschtempo aus.'}`;
    else if(req>sp)msg+=`Dein Wunschtermin ist sehr ehrgeizig: Dafür wären <b>${N1(req)} kg pro Woche</b> nötig. Das ist auf Dauer schwer durchzuhalten und deinem Körper zuliebe nicht zu empfehlen. Entspannter wäre etwa der <b>${fd(safeDate)}</b>. Du musst nichts überstürzen!`;
    else if(wk<=wLeft*1.1)msg+=`<b>Das ist machbar! 💪</b> Nötig sind etwa <b>${N1(req)} kg pro Woche</b>, und dein Kalorienziel passt dazu (ca. ${N1(aw)} kg pro Woche). Bleib dran, dann wirst du voraussichtlich um den <b>${fd(proj)}</b> am Ziel sein.`;
    else msg+=`Dein Wunschtermin ist möglich, aber knapp: Du brauchst etwa <b>${N1(req)} kg pro Woche</b>, dein Kalorienziel ergibt ca. <b>${N1(aw)} kg</b>. Mit dem aktuellen Plan wärst du voraussichtlich um den <b>${fd(proj)}</b> da. Gib dir ruhig ein paar Wochen mehr.`;
  }
  const sw=p.sw||0,moved=sw&&Math.abs(sw-tw)>=.1?Math.max(0,Math.min(1,(sw-cur)/(sw-tw))):null;
  const c2=low&&!reached?['–','pro Woche']:future?[N1(req),'pro Woche nötig']:ok&&wk<=104?['ca. '+N1(aw),'pro Woche möglich']:['–','pro Woche'];
  const c3=low&&!reached?['–','Wochen']:future?[Math.max(1,Math.ceil(wLeft)),'Wochen bis '+fs(tdate)]:ok&&wk<=104?['ca. '+Math.max(1,Math.ceil(wk)),'Wochen voraussichtlich']:['–','Wochen'];
  return`<div class="card goal"><div class="gt">Dein Weg zu <b>${N1(tw)} kg</b></div>
  <div class="hero2" style="margin-top:14px"><div class="side"><b>${reached?'0,0':N1(ad)}</b><span class="mut">kg noch</span></div><div class="side"><b>${c2[0]}</b><span class="mut">${c2[1]}</span></div><div class="side"><b>${c3[0]}</b><span class="mut">${c3[1]}</span></div></div>
  ${moved!=null?`<div style="margin-top:16px"><div class="bar"><i style="width:${R(moved*100)}%;background:var(--acc)"></i></div><div class="mut" style="font-size:13px;margin-top:6px">${moved>0?`Schon ${N1(Math.abs(sw-cur))} kg geschafft, das sind ${R(moved*100)} %`:'Los geht’s, jeder Schritt zählt.'}</div></div>`:''}
  ${msg?`<div class="gmsg">${msg}</div>`:''}
  ${low?`<div class="gmsg gwarn">Dein Zielgewicht entspricht einem BMI von ${N1(bmi)} und liegt damit unter dem Normalbereich (ab 18,5). Dafür zeigen wir dir bewusst keinen Zeitplan. Sprich bitte mit einer Ärztin oder einem Arzt, bevor du das anstrebst. Deine Gesundheit geht vor.</div>`:''}
  <div class="mut gnote">Alles hier ist eine Schätzung aus deinen Angaben und deinem Kalorienziel. Dein Körper ist einzigartig, nimm es als Orientierung und nicht als Versprechen. Deine Kalorienziele ändert diese Übersicht nicht.</div></div>`;
}

function localSearch(q){
  const qt=words(q).map(stem);if(!qt.length)return[];
  return BASIC.map(f=>{const nw=words(f.name+' '+f.al).map(stem);let sc=0;
    for(const t of qt){if(nw.includes(t))sc+=3;else if(nw.some(w=>w.startsWith(t)))sc+=2;else return null}
    if(stem(words(f.name)[0])===qt[0])sc+=3;return{f,sc}}).filter(Boolean)
    .sort((a,b)=>b.sc-a.sc||a.f.name.length-b.f.name.length).slice(0,8).map(x=>x.f)}
const FIELDS='code,product_name,brands,nutriments,serving_quantity';
const str=v=>Array.isArray(v)?String(v[0]||''):(v&&typeof v==='object'?String(v.de||v.main||Object.values(v)[0]||''):String(v||''));
function norm(p){const n=p.nutriments||{},k=n['energy-kcal_100g']??(n.energy_100g?n.energy_100g/4.184:null),name=str(p.product_name).trim();
  if(!name||k==null)return null;const P=+n.proteins_100g||0,C=+n.carbohydrates_100g||0,F=+n.fat_100g||0;
  if(!(k>=0&&k<=950)||P+C+F>105)return null;const s=+p.serving_quantity||0;
  return{name,brand:str(p.brands).split(',')[0].trim(),k:+k,p:P,c:C,f:F,s,u:s>0?'Portion':'',ug:s,code:p.code}}
// Treffer filtern und nach Relevanz sortieren: alle Suchwörter müssen vorkommen, Namens-Treffer zählen mehr
function rank(L,q){const qt=words(q).map(stem),seen={};
  return L.map((f,i)=>{const nw=words(f.name).map(stem),all=words(f.name+' '+f.brand).map(stem);
    if(!qt.every(t=>all.some(w=>w.startsWith(t))))return null;
    const key=nz(f.name+f.brand);if(seen[key])return null;seen[key]=1;
    let sc=0;qt.forEach(t=>{if(nw.includes(t))sc+=2;else if(nw.some(w=>w.startsWith(t)))sc+=1});
    if(nw[0]&&nw[0].startsWith(qt[0]))sc+=2;
    return{f,sc:sc-nw.length*.15-i*.02}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).map(x=>x.f)}
async function getJSON(url,ms=8000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);

const qcache={};
async function offSearch(q){
  if(qcache[q])return qcache[q];const e=encodeURIComponent(q);let err;
  const urls=[`https://search.openfoodfacts.org/search?q=${e}&langs=de,en&page_size=40&fields=${FIELDS}`,
    `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${e}&search_simple=1&action=process&json=1&page_size=40&lc=de&sort_by=unique_scans_n&fields=${FIELDS}`];
  for(const u of urls){try{const j=await getJSON(u),L=rank((j.hits||j.products||[]).map(norm).filter(Boolean),q);if(L.length){qcache[q]=L;return L}}catch(x){err=x}}
  if(err)throw err;return[]}

async function lookup(code){
  toast('Suche Barcode '+code+' …');let f=null,fail=false;const c=encodeURIComponent(code);
  for(const u of [`https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=${FIELDS}`,`https://world.openfoodfacts.org/api/v0/product/${c}.json?fields=${FIELDS}`]){
    try{const j=await getJSON(u,9000);f=(j.status===1&&norm(j.product))||null;fail=false;break}catch(e){fail=true}}
  if(fail){toast('Datenbank antwortet nicht. Bitte nochmal scannen.');return}

let stopScan=()=>{$('#scan').hidden=true};

async function startScan(){
  ctx.editId=null;$('#add').hidden=true;$('#scan').hidden=false;let done=false;
  const hit=c=>{if(done)return;done=true;stopScan();lookup(c)};
  try{
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}),v=$('#vid');v.srcObject=st;await v.play();let on=true;
      stopScan=()=>{on=false;st.getTracks().forEach(t=>t.stop());v.srcObject=null;$('#scan').hidden=true};
      (async()=>{while(on){try{const r=await det.detect(v);if(r.length)return hit(r[0].rawValue)}catch(e){}await new Promise(r=>setTimeout(r,250))}})();
    }else{
      await loadZX();const rd=new ZXing.BrowserMultiFormatReader();
      stopScan=()=>{try{rd.reset()}catch(e){}$('#scan').hidden=true};
      rd.decodeFromVideoDevice(null,'vid',r=>{if(r)hit(r.getText())});
    }
  }catch(e){toast('Kamera nicht verfügbar. Seite per https öffnen und Zugriff erlauben – oder Code manuell eingeben.')}
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(ctx.swiped&&b&&b.dataset.a==='edit'){ctx.swiped=false;return}if(b&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('mrow')){e.preventDefault();A.toggle(e.target)}if(e.key==='Enter'&&e.target.id==='man')A.manual();if(e.key==='Enter'&&e.target.id==='lp')A.login()});
// ===== Menü auf/zu mit Animation =====
function showSheet(){const m=$('#add');clearTimeout(showSheet.t);m.classList.remove('out');m.hidden=false}
function closeSheet(){const m=$('#add');if(m.hidden)return;m.classList.add('out');clearTimeout(showSheet.t);showSheet.t=setTimeout(()=>{m.hidden=true;m.classList.remove('out')},230)}
// ===== Wischen zum Löschen =====
(function(){let st=null;
  document.addEventListener('pointerdown',e=>{ctx.swiped=false;const fg=e.target.closest&&e.target.closest('.sw-fg');if(!fg||e.target.closest('button'))return;st={fg,x:e.clientX,y:e.clientY,dx:0,on:false,id:e.pointerId}});
  document.addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.id)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.on){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.4&&dx<0){st.on=true;st.fg.classList.add('drag');st.fg.parentNode.classList.add('dragging');try{st.fg.setPointerCapture(e.pointerId)}catch(x){}}else if(Math.abs(dy)>10){st=null;return}else return}
    st.dx=Math.max(dx,-150);st.fg.style.transform='translateX('+st.dx+'px)';st.fg.parentNode.classList.toggle('armed',st.dx<-80);ctx.swiped=true});
  const end=e=>{if(!st||e.pointerId!==st.id)return;const s=st;st=null;if(!s.on)return;const w=s.fg.parentNode;s.fg.classList.remove('drag');
    if(s.dx<-80){s.fg.style.transform='translateX(-110%)';w.style.maxHeight=w.offsetHeight+'px';requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('gone')));setTimeout(()=>A.del({dataset:{id:w.dataset.id}}),300)}
    else{s.fg.style.transform='';w.classList.remove('armed','dragging')}};
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end)})();

// ===== Konto & Sync (Supabase). Hier nach dem Einrichten eintragen: =====
const CFG={url:'',key:'',signup:false}; // signup:true zeigt „Konto erstellen“ (nur kurz zum Anlegen der Konten, danach wieder false)
const slug=v=>v.trim().toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9._-]/g,'');   // Project URL und anon/public key – NIE den service_role key!
let sb=null,uid=null,ts=0,pt,uname='';
function fresh(){const a=$('#app');a.classList.add('fresh');clearTimeout(fresh.t);fresh.t=setTimeout(()=>a.classList.remove('fresh'),1100)}
const KEY=()=>'killcal-'+(uid||uname||'local');
// Zugang ohne Server: Namen + Code (nur Sperre der Oberfläche, kein echter Schutz)
const h53=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const LOCK={chriss:'l5862oxko8',kianah:'567de7fb8k'};
const SESS='killcal-session';
// Akzentfarbe pro Person (hier ändern: acc = Hauptfarbe, acct = helle Textfarbe, acc2 = Verlaufsstart, rgb = Hauptfarbe als R,G,B)
const THEMES={
  chriss:{acc:'#9E13FF',acct:'#bf6bff',acc2:'#c46bff',rgb:'158,19,255',icon:'icon-192.png',touch:'apple-touch-icon.png'},
  kianah:{acc:'#FF2E93',acct:'#ff8fc2',acc2:'#ffa3cd',rgb:'255,46,147',icon:'icon-kianah-192.png',touch:'apple-touch-icon-kianah.png'}
};
const tint=(rgb,k,o)=>rgb.split(',').map(v=>Math.round(+v*k+o)).join(',');
function applyTheme(n){const t=THEMES[n]||THEMES.chriss,r=document.documentElement.style;
  const bg=tint(t.rgb,.17,6),cd=tint(t.rgb,.22,17),ln=tint(t.rgb,.3,34);
  r.setProperty('--bgrgb',bg);r.setProperty('--bg','rgb('+bg+')');r.setProperty('--card','rgb('+cd+')');r.setProperty('--line','rgb('+ln+')');
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content','rgb('+bg+')');
  const li=document.querySelector('link[rel=icon]'),lt=document.querySelector('link[rel=apple-touch-icon]');if(li)li.href=t.icon;if(lt)lt.href=t.touch;r.setProperty('--acc',t.acc);r.setProperty('--acct',t.acct);r.setProperty('--acc2',t.acc2);r.setProperty('--accrgb',t.rgb)}
function push(){if(!sb||!uid)return;clearTimeout(pt);pt=setTimeout(async()=>{ts=new Date();const{error}=await sb.from('diary').upsert({user_id:uid,data:S,updated_at:ts.toISOString()});if(error)toast('Sync fehlgeschlagen – bitte Verbindung prüfen.')},800)}
async function pull(){if(!sb||!uid)return;try{const{data}=await sb.from('diary').select('data,updated_at').eq('user_id',uid).maybeSingle();if(data&&new Date(data.updated_at)>ts){ts=new Date(data.updated_at);S=Object.assign(S,data.data);render()}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
function setAvatar(file){const r=new FileReader();r.onerror=()=>toast('Bild konnte nicht gelesen werden.');r.onload=()=>{const im=new Image();im.onerror=()=>toast('Dieses Bild kann ich nicht öffnen. Versuche ein JPG oder PNG.');
  im.onload=()=>{const z=256,c=document.createElement('canvas');c.width=c.height=z;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.fillStyle='#000';x.fillRect(0,0,z,z);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);S.avatar=c.toDataURL('image/jpeg',.86);save();render();toast('Profilbild gespeichert.')};im.src=r.result};r.readAsDataURL(file)}
document.addEventListener('change',e=>{if(e.target.id==='avf'&&e.target.files[0]){setAvatar(e.target.files[0]);return}if(e.target.id!=='imp'||!e.target.files[0])return;e.target.files[0].text().then(t=>{try{const j=JSON.parse(t);if(!j.days)throw 0;S=Object.assign({profile:null,days:{},weights:[],recent:[],dishes:[]},j);save();tab=S.profile?'diary':'profile';render();toast('Import fertig.')}catch(x){toast('Datei nicht lesbar.')}})});
function loginView(){document.querySelector('nav').style.display='none';$('#app').innerHTML=`<h1 style="text-align:center;margin-top:60px">KillCal</h1><div class="card"><label>Name</label><input id="lu" autocapitalize="words" autocomplete="username"><div class="mut" style="margin-top:6px">${CFG.url?'Dein Name ist zugleich dein Anmeldename (klein geschrieben).':''}</div><label>${CFG.url?'Passwort':'Code'}</label><input id="lp" type="password" inputmode="${CFG.url?'text':'numeric'}" autocomplete="current-password"><button data-a="login" style="width:100%;margin-top:14px">Anmelden</button>${CFG.signup?'<button class="sec" data-a="signup" style="width:100%;margin-top:8px">Konto erstellen</button>':''}</div>`}
async function enter(u){
  uid=u?u.id:null;uname=u&&u.email?u.email.split('@')[0]:'';applyTheme(uname);ctx.pc={};ctx.pr={};let loc={},rem;
  try{loc=JSON.parse(localStorage.getItem(KEY())||'{}')}catch(e){}
  if(sb){try{const r=await sb.from('diary').select('data,updated_at').eq('user_id',uid).maybeSingle();if(!r.error)rem=r.data||{data:{}}}catch(e){}}
  const use=rem&&Object.keys(rem.data||{}).length?rem.data:loc;
  ts=rem&&rem.updated_at?new Date(rem.updated_at):0;
  S=Object.assign({profile:null,days:{},weights:[],recent:[],dishes:[]},use);
  if(!S.name&&uname)S.name=uname.charAt(0).toUpperCase()+uname.slice(1);tab=S.profile?'diary':'profile';date=iso(new Date());
  document.querySelector('nav').style.display='';render();fresh();
  if(sb&&rem!==undefined)push();
}
async function boot(){
  applyTheme('');
  if(CFG.url&&CFG.key){
    if(!window.supabase){document.querySelector('nav').style.display='none';$('#app').innerHTML='<h1>KillCal</h1><p class="mut">Keine Verbindung. Bitte online öffnen.</p>';return}
    sb=supabase.createClient(CFG.url,CFG.key);const{data}=await sb.auth.getSession();
    if(data.session)enter(data.session.user);else loginView();
  }else{let u='';try{u=localStorage.getItem(SESS)||''}catch(e){}if(LOCK[u])enter({id:null,email:u+'@lokal'});else loginView()}
}
window.addEventListener('load',boot);
</script></body></html>
